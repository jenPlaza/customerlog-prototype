<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Added user-scalable=no to force the browser to respect 100% lock bounds -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Pantry Order Viewer</title>
    <link rel="stylesheet" href="./assets/css/clReusable.css" />
    <link rel="stylesheet" href="./assets/css/clOrders.css" />
  </head>
  <body>
    <header class="scroll-in-place">
      <div class="container">
        <figure class="logo">
          <img
            src="./assets/images/communitywellness-logo.png"
            id="logo"
            alt="Community Wellness logo"
            width="15%"
            height="15%"
          />
        </figure>
        <nav id="menu" style="display: block">
          <ul>
            <li>
              <a href="./index.html" name="home" target="_blank"> Home</a>
            </li>
            <li>
              <a href="./queue.html" name="queue" target="_blank"> Queue</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <main>
      <div class="order-card card" id="profile-card" style="display: none">
        <!-- header section -->
        <header class="header">
          <div class="ticket-number xxsFont" id="view-id">
            Pantry Order #0000
          </div>
          <h1 id="view-name">Loading Name...</h1>
        </header>
        <!-- Household section -->
        <div class="data-section">
          <p>
            <strong>Household Size:</strong>
            <span id="view-household">Loading...</span>
          </p>
        </div>
        <!-- Item List section -->
        <div class="data-section">
          <p class="label xxsFont">Assigned Items & Equipment</p>
          <div class="card value items-list" id="view-items">-</div>
        </div>
        <!-- Active / Inactive Status section -->
        <div class="data-section">
          <p class="label xxsFont">Current Status</p>
          <div id="view-status">
            <span id="status-pill" class="xsFont">Pending</span>
          </div>
        </div>
        <!-- Close Button section-->
        <footer>
          <button onclick="closeWorkOrderCard()">
            Close Pantry Order View
          </button>
        </footer>
      </div>
      <!-- Status Message (Hidden once data loads) -->
      <div id="message" class="xxsFont">Reading link parameters...</div>
    </main>
    <footer>
      <div>
        <section>
          <h4>&copy; 2026 Community Wellness.</h4>
        </section>
        <section>
          <h4>407-234-5690</h4>
        </section>
        <ul>
          <li>
            <img src="./assets/images/facebook-bk.png" alt="facebook icon" />
          </li>
          <li>
            <img src="./assets/images/instagram-bk.png" alt="instagram icon" />
          </li>
          <li>
            <img src="./assets/images/linkedin-bk.png" alt="linkedIn icon" />
          </li>
        </ul>
      </div>
      <!-- Designer Footer Section with Schema Microdata -->
      <div class="site-footer" itemscope itemtype="https://schema.org">
        <p class="xxsFont">
          Created and Crafted by
          <span class="designer-name"
            ><a
              href="https://jennplaza.wordpress.com/skill-set/"
              target="_blank"
              itemprop="creator"
              itemscope
              itemtype="https://schema.org"
              itemprop="name"
              >Jenn Plaza</a
            ></span
          >
        </p>
      </div>
    </footer>
    <script
      type="text/javascript"
      src="./assets/js/clOrder_GSheets.js"
    ></script>
  </body>
</html>
